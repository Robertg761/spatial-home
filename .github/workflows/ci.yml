name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job to pass. Add new steps (tests,
  # type checks, builds) here as the code arrives, so the required check
  # name stays "ci".
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Generate mobile route types
        working-directory: apps/mobile
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the editor
        run: npm run build

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
